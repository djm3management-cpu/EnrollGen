<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- index.html -->
    <link rel="icon" type="image/png" sizes="32x32" href="/flag.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/flag.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnrollGen</title>
    <meta
      name="description"
      content="EnrollGen gives agents AI-guided Medicare enrollment workflows, compliance checkpoints, and real-time call support."
    />
    <meta
      property="og:title"
      content="EnrollGen | Compliant Medicare Enrollment, Guided by AI"
    />
    <meta
      property="og:description"
      content="AI-guided enrollment workflows for compliant Medicare, ACA, Medicare Supplement, U65, and ancillary sales teams."
    />
    <meta property="og:image" content="/logofinalshadow.png" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const key = "enrollgen_theme_mode_v1";
        const root = document.documentElement;
        root.classList.add("theme-initializing");
        let theme = null;
        try {
          theme = localStorage.getItem(key);
        } catch {
          theme = null;
        }
        if (theme !== "dark" && theme !== "light") {
          theme = "dark";
        }
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#000000" : "#171411");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
