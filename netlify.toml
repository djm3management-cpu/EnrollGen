[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Worker entry points resolve these installed Node packages at runtime.
  external_node_modules = ["read-excel-file", "papaparse"]

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/vendor/paragon"
  to = "/.netlify/functions/paragon-vendor-report"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/calls"
  to = "/crm/calls"
  status = 301

# SPA fallback
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# UTC timers poll; deployment timezone determines local report boundaries.
[functions."nightly-analytics"]
  schedule = "0 * * * *"

[functions."weekly-coaching"]
  schedule = "0 * * * *"

[functions."sync-bulletins"]
  schedule = "0 10 * * *"

# Try each hour; the handler admits the profile local reporting window.
[functions."paragon-daily-email"]
  schedule = "0,15,30 * * * *"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false

[functions."sync-fema"]
  schedule = "0 9 * * *"

# Deployment-specific CSP is generated into dist/_headers by the Vite build.
# CSP_MODE=report-only (default); change to enforce after browser acceptance.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), accelerometer=(), ambient-light-sensor=(), attribution-reporting=(), autoplay=(self), battery=(), bluetooth=(), browsing-topics=(), clipboard-read=(), clipboard-write=(self), compute-pressure=(), display-capture=(self), encrypted-media=(), fullscreen=(), gamepad=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(self), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), speaker-selection=(self), storage-access=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()"
