[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/vendor/paragon"
  to = "/.netlify/functions/paragon-vendor-report"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/calls"
  to = "/crm/calls"
  status = 301

# SPA fallback
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# UTC timers poll; deployment timezone determines local report boundaries.
[functions."nightly-analytics"]
  schedule = "0 * * * *"

[functions."weekly-coaching"]
  schedule = "0 * * * *"

[functions."sync-bulletins"]
  schedule = "0 10 * * *"

# Try each hour; the handler admits the profile local reporting window.
[functions."paragon-daily-email"]
  schedule = "0,15,30 * * * *"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false

[functions."sync-fema"]
  schedule = "0 9 * * *"
