[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify cron expressions are UTC. These align with the requested ET
# windows during daylight saving time.
[functions."nightly-analytics"]
  schedule = "0 6 * * *"

[functions."weekly-coaching"]
  schedule = "0 11 * * 1"

[functions."sync-bulletins"]
  schedule = "0 10 * * *"

[functions."update-knowledge"]
  schedule = "0 7 * * 0"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false
