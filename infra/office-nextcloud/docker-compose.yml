services:
  nextcloud-db:
    image: mariadb:11.4
    container_name: enrollgen-nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nextcloud-db:/var/lib/mysql
    networks:
      - enrollgen-office

  nextcloud:
    image: nextcloud:stable-apache
    container_name: enrollgen-nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_APP_TOKEN}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      - enrollgen-office

  sync:
    build:
      context: ./sync
    container_name: enrollgen-supabase-nextcloud-sync
    restart: unless-stopped
    depends_on:
      - nextcloud
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_APP_TOKEN: ${NEXTCLOUD_APP_TOKEN}
      SUPABASE_SUMMARY_BUCKET: ${SUPABASE_SUMMARY_BUCKET}
      SUPABASE_TRANSCRIPT_BUCKET: ${SUPABASE_TRANSCRIPT_BUCKET}
      SUPABASE_SUMMARY_PATH_FIELDS: ${SUPABASE_SUMMARY_PATH_FIELDS}
      SUPABASE_TRANSCRIPT_PATH_FIELDS: ${SUPABASE_TRANSCRIPT_PATH_FIELDS}
      SUPABASE_TRANSCRIPT_TEXT_FIELDS: ${SUPABASE_TRANSCRIPT_TEXT_FIELDS}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_TIME_COLUMN: ${SYNC_TIME_COLUMN:-created_at}
      SUPABASE_CALLS_TABLE: ${SUPABASE_CALLS_TABLE:-call_records}
      SUPABASE_CALL_SELECT: ${SUPABASE_CALL_SELECT:-*}
      SUPABASE_PAGE_SIZE: ${SUPABASE_PAGE_SIZE:-50}
      INITIAL_SYNC_SINCE: ${INITIAL_SYNC_SINCE:-1970-01-01T00:00:00Z}
      ADVANCE_ON_MISSING_ARTIFACTS: ${ADVANCE_ON_MISSING_ARTIFACTS:-false}
      STATE_DB: /data/sync-state.sqlite3
      LOG_FILE: /logs/sync.log
    volumes:
      - sync-state:/data
      - ./logs:/logs
    networks:
      - enrollgen-office

volumes:
  nextcloud-db:
  nextcloud-data:
  sync-state:

networks:
  enrollgen-office:
    name: enrollgen-office
